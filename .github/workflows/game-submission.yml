name: Spiel-Einreichung → Pull-Request

# Wandelt ein über die App (oder das Issue-Formular) eingereichtes Spiel-Issue
# automatisch in einen Pull-Request um: Datei anlegen, PR öffnen, Issue
# kommentieren. Ein Maintainer muss den PR dann nur noch prüfen und mergen.
#
# Erkennung über den Marker "<!-- game-submission -->" im Issue-Text und den
# darin enthaltenen ```md …``` -Block (von js/customgames.js erzeugt).

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  to-pr:
    if: contains(github.event.issue.body, '<!-- game-submission -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body  = issue.body || '';
            const { owner, repo } = context.repo;
            const comment = (b) => github.rest.issues.createComment({
              owner, repo, issue_number: issue.number, body: b });

            // 1) Markdown-Block extrahieren
            const m = body.match(/```md\s*\r?\n([\s\S]*?)\r?\n```/);
            if (!m) {
              await comment('⚠️ Ich konnte den Spiel-Eintrag (den ```md …``` -Block) nicht finden. Bitte den von der App erzeugten Text unverändert einfügen.');
              return;
            }
            const md = m[1].trim() + '\n';

            // 2) id ermitteln + validieren (nur a–z, 0–9, „-")
            const idM = md.match(/^id:\s*([a-z0-9-]+)\s*$/m);
            if (!idM) {
              await comment('⚠️ Keine gültige `id:` gefunden (erlaubt sind nur a–z, 0–9 und „-").');
              return;
            }
            const id = idM[1];

            // 3) Pflichtfelder grob prüfen (Spiegel der App-Validierung)
            const need = [
              [/^name:\s*\S/m, 'name'],
              [/^icon:\s*\S/m, 'icon'],
              [/^kind:\s*(sport|spiel|uebung)\s*$/m, 'kind'],
              [/^structure:\s*\S/m, 'structure'],
              [/^scoring:\s*\S/m, 'scoring'],
              [/##\s*Ablauf/, '## Ablauf'],
              [/##\s*Tipp/, '## Tipp'],
            ];
            const missing = need.filter(([re]) => !re.test(md)).map(([, n]) => n);
            if (missing.length) {
              await comment(`⚠️ Es fehlen Pflichtfelder: ${missing.join(', ')}.`);
              return;
            }

            const path = `content/games/${id}.md`;

            // 4) Existiert die Datei schon?
            try {
              await github.rest.repos.getContent({ owner, repo, path });
              await comment(`ℹ️ Eine Datei \`${path}\` existiert bereits. Bitte einen anderen Namen wählen.`);
              return;
            } catch (e) { if (e.status !== 404) throw e; }

            const branch = `einreichung/${id}`;

            // 5) Branch schon vorhanden? → bereits verarbeitet
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              await comment(`ℹ️ Für diesen Vorschlag wurde bereits ein Branch (\`${branch}\`) angelegt.`);
              return;
            } catch (e) { if (e.status !== 404) throw e; }

            // 6) Label sicherstellen + setzen
            try { await github.rest.issues.getLabel({ owner, repo, name: 'spiel-einreichung' }); }
            catch {
              try { await github.rest.issues.createLabel({ owner, repo, name: 'spiel-einreichung', color: '0E8A16', description: 'Über die App eingereichtes Spiel' }); } catch {}
            }
            try { await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['spiel-einreichung'] }); } catch {}

            // 7) Branch vom Default-Branch anlegen
            const def  = (await github.rest.repos.get({ owner, repo })).data.default_branch;
            const base = await github.rest.git.getRef({ owner, repo, ref: `heads/${def}` });
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: base.data.object.sha });

            // 8) Datei im Branch anlegen
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `Spiel-Einreichung: ${id} (aus #${issue.number})`,
              content: Buffer.from(md, 'utf8').toString('base64'),
            });

            // 9) Pull-Request öffnen (schließt das Issue beim Merge)
            const pr = await github.rest.pulls.create({
              owner, repo, base: def, head: branch,
              title: `Neues Spiel: ${id}`,
              body: `Automatisch aus #${issue.number} erzeugt.\n\nDatei: \`${path}\`\n\nBitte prüfen und mergen. Closes #${issue.number}`,
            });
            await comment(`✅ Danke für den Vorschlag! Er wurde als Pull-Request #${pr.data.number} angelegt und wird von einem Maintainer geprüft.`);
